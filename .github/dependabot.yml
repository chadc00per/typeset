# Keeps the pinned actions and the dependencies current. The cooldown holds back brand-new
# releases for a week, so a compromised version has time to be caught before it lands here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor and patch updates together; a major update gets a pull request of its own,
      # so one breaking change doesn't hold back the rest.
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler) drops the JavaScript API that
      # js/tests/readme.test.js uses to type-check the README's examples.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
